name: Build

on: push

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: false
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
      - name: Build
        run: |
          cd frontend
          npm ci
          npm run build
