<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Gestion des Tâches d'Équipe</title>
    <link href="./index.css" rel="stylesheet" type="text/css">
    <link href="./favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-logo" onclick="toggleStats()" style="cursor: pointer;">
            <i data-lucide="list-checks" style="width: 32px; height: 32px;"></i>
        </div>
        <h1>Gestion des Tâches 3990</h1>
        <div class="header-logo-right">
            <img alt="Logo" src="logo.png" style="width: 82px; height: 82px;">
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card" onclick="filterTasks('all')" style="cursor: pointer;">
            <div class="stat-content">
                <h3>Total</h3>
                <p id="stat-total" style="color: #1e293b;"></p>
            </div>
            <div class="stat-icon" style="background: #f1f5f9;">
                <i data-lucide="tag" style="color: #64748b; width: 50px; height: 50px;"></i>
            </div>
        </div>
        <div class="stat-card" onclick="filterTasks('todo')" style="cursor: pointer;">
            <div class="stat-content">
                <h3>À faire</h3>
                <p id="stat-todo" style="color: #ff999c;"></p>
            </div>
            <div class="stat-icon" style="background: #ff999c;">
                <i data-lucide="circle" style="color: #64748b; width: 50px; height: 50px;"></i>
            </div>
        </div>
        <div class="stat-card" onclick="filterTasks('in_progress')" style="cursor: pointer;">
            <div class="stat-content">
                <h3>En cours</h3>
                <p id="stat-progress" style="color: #3b82f6;"></p>
            </div>
            <div class="stat-icon" style="background: #dbeafe;">
                <i data-lucide="clock" style="color: #3b82f6; width: 50px; height: 50px;"></i>
            </div>
        </div>
        <div class="stat-card" onclick="filterTasks('done')" style="cursor: pointer;">
            <div class="stat-content">
                <h3>Terminées</h3>
                <p id="stat-done" style="color: #10b981;"></p>
            </div>
            <div class="stat-icon" style="background: #d1fae5;">
                <i data-lucide="check-circle-2" style="color: #10b981; width: 50px; height: 50px;"></i>
            </div>
        </div>
    </div>
    <!-- Floating Add Button -->
    <button class="floating-add-btn" onclick="openModal()"></button>

    <div class="tasks-list" id="tasks-container">
        <div style="text-align: center; padding: 2rem;">Loading tasks...</div>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title">Nouvelle tâche</h2>
            <button class="btn-icon" onclick="closeModal()" style="background: transparent;">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="task-form">
                <div class="form-group">
                    <label>Titre *</label>
                    <input id="task-title" required type="text">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="task-description" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="task-status">
                            <option value="todo">À faire</option>
                            <option value="in_progress">En cours</option>
                            <option value="done">Terminé</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priorité</label>
                        <select id="task-priority">
                            <option value="low">Basse</option>
                            <option value="medium">Moyenne</option>
                            <option value="high">Haute</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Projet</label>
                        <select id="task-project">
                            <option value="">Sélectionner un projet</option>
                            <option value="1">Marketing Q4</option>
                            <option value="2">Développement App</option>
                            <option value="3">Support Client</option>
                            <option value="4">Infrastructure</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Assigné à</label>
                        <select id="task-assignee">
                            <option value="">Sélectionner un membre</option>
                            <option value="1">Sophie Martin</option>
                            <option value="2">Lucas Dubois</option>
                            <option value="3">Marie Lefebvre</option>
                            <option value="4">Thomas Bernard</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Date d'échéance</label>
                    <input id="task-date" type="date">
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeModal()" type="button">Annuler</button>
                    <button class="btn-submit" onclick="submitTask()" id="submit-btn" type="submit">Créer la tâche</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="./index.js"></script>
</body>
</html>
