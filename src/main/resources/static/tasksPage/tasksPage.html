<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des tâches team3990</title>
    <link href="tasksPage.css" rel="stylesheet" type="text/css">
    <link href="https://tech.team3990.com/favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>
<body>
<!-- Menu Section -->
<section id="menu" class="menu-section">
    <div class="menu-content">
        <h1 class="menu-title">Tech Team</h1>
        <h2 class="menu-subtitle">3990!</h2>
        <p class="menu-description">
            Équipe de robotique compétitive FRC, innovant en ingénierie et technologie
        </p>
        <p class="menu-tags-text">
            Robotique, Programmation, Mécanique, Électronique, Design, Stratégie
        </p>
        <p class="menu-cta">🚀 Dashboard</p>
    </div>
</section>

<!-- Tasks Section -->
<section id="tasks" class="tasks-section">
    <div class="container">
        <div class="header" id="header">
            <div class="header-left">
                <div class="header-logo" onclick="toggleStats()" style="cursor: pointer;">
                    <i data-lucide="list-checks" style="width: 32px; height: 32px;"></i>
                </div>
                <div class="header-nav-buttons">
                    <a href="#menu" class="header-nav-btn active" data-section="menu" onclick="setActiveButton(this)">
                        <i data-lucide="menu"></i>
                        Menu
                    </a>
                    <a href="#tasks" class="header-nav-btn" data-section="tasks" onclick="setActiveButton(this)">
                        <i data-lucide="layout-dashboard"></i>
                        Dashboard
                    </a>
                </div>
            </div>
            <h1>Gestion des Tâches 3990</h1>
            <div class="header-logo-right">
                <img alt="Logo" src="https://tech.team3990.com/assets/images/T4K.png" style="width: 82px; height: 82px;">
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card" onclick="filterTasks('all')" style="cursor: pointer;">
                <div class="stat-content">
                    <h3>Total</h3>
                    <p id="stat-total" style="color: #1e293b;"></p>
                </div>
                <div class="stat-icon" style="background: #f1f5f9;">
                    <i data-lucide="tag" style="color: #64748b; width: 50px; height: 50px;"></i>
                </div>
            </div>
            <div class="stat-card" onclick="filterTasks('todo')" style="cursor: pointer;">
                <div class="stat-content">
                    <h3>À faire</h3>
                    <p id="stat-todo" style="color: #ff999c;"></p>
                </div>
                <div class="stat-icon" style="background: #ff999c;">
                    <i data-lucide="circle" style="color: #64748b; width: 50px; height: 50px;"></i>
                </div>
            </div>
            <div class="stat-card" onclick="filterTasks('in_progress')" style="cursor: pointer;">
                <div class="stat-content">
                    <h3>En cours</h3>
                    <p id="stat-progress" style="color: #3b82f6;"></p>
                </div>
                <div class="stat-icon" style="background: #dbeafe;">
                    <i data-lucide="clock" style="color: #3b82f6; width: 50px; height: 50px;"></i>
                </div>
            </div>
            <div class="stat-card" onclick="filterTasks('done')" style="cursor: pointer;">
                <div class="stat-content">
                    <h3>Terminées</h3>
                    <p id="stat-done" style="color: #10b981;"></p>
                </div>
                <div class="stat-icon" style="background: #d1fae5;">
                    <i data-lucide="check-circle-2" style="color: #10b981; width: 50px; height: 50px;"></i>
                </div>
            </div>
        </div>

        <!-- Floating Add Button -->
        <button class="floating-add-btn" onclick="openModal()"></button>

        <div class="tasks-list" id="tasks-container">
            <div style="text-align: center; padding: 2rem;">Loading tasks...</div>
        </div>
    </div>
</section>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title">Nouvelle tâche</h2>
            <button class="btn-icon" onclick="closeModal()" style="background: transparent;">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="task-form">
                <div class="form-group">
                    <label>Titre *</label>
                    <input id="task-title" required type="text">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="task-description" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="task-status">
                            <option value="todo">À faire</option>
                            <option value="in_progress">En cours</option>
                            <option value="done">Terminé</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priorité</label>
                        <select id="task-priority">
                            <option value="low">Basse</option>
                            <option value="medium">Moyenne</option>
                            <option value="high">Haute</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Assigné à</label>
                        <select id="task-assignee">
                            <option value="">Sélectionner un membre</option>
                            <option value="1">Sophie Martin</option>
                            <option value="2">Lucas Dubois</option>
                            <option value="3">Marie Lefebvre</option>
                            <option value="4">Thomas Bernard</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Date d'échéance</label>
                    <input id="task-date" type="date">
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeModal()" type="button">Annuler</button>
                    <button class="btn-submit" onclick="submitTask()" id="submit-btn" type="submit">Créer la tâche</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../common.js"></script>
<script src="tasksPage.js"></script>
<script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Handle active navbar button based on scroll position
    function setActiveButton(button) {
        document.querySelectorAll('.navbar-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
    }

    // Header shrink on scroll
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
        const header = document.getElementById('header');
        const currentScroll = window.scrollY;

        // Add shrink class when scrolled down
        if (currentScroll > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }

        // Update active button
        const sections = document.querySelectorAll('section');
        const navButtons = document.querySelectorAll('.navbar-btn');

        let current = '';
        sections.forEach(section => {
            const sectionTop = section.offsetTop;
            const sectionHeight = section.clientHeight;
            if (currentScroll >= (sectionTop - 100)) {
                current = section.getAttribute('id');
            }
        });

        navButtons.forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-section') === current) {
                btn.classList.add('active');
            }
        });

        lastScroll = currentScroll;
    });
</script>
</body>
</html>
