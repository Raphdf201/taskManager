components:
  schemas:
    ExposedUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          x-apidog-mock: '{{$person.fullName}}'
        profileIcon:
          type:
            - string
            - 'null'
          x-apidog-mock: '{{$internet.url}}'
      x-apidog-orders:
        - id
        - name
        - profileIcon
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    ExposedTaskSend:
      type: object
      properties:
        id:
          type: integer
          x-apidog-mock: '{{$number.int(min=1)}}'
        title:
          type: string
          description: max 50 chars
        description:
          type: string
          description: max 500 chars
        priority:
          type: string
          description: low, medium or high
        status:
          type: string
          description: todo, in_progress or done
        creatorId:
          type: string
          description: same as user id
        dueDate:
          type: string
          description: yyyy-mm-dd
      x-apidog-orders:
        - id
        - title
        - description
        - priority
        - status
        - creatorId
        - dueDate
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    ExposedTaskReceive:
      type: object
      properties:
        title:
          type: string
          description: max 50 chars
          maxLength: 50
        description:
          type: string
          description: max 500 chars
          maxLength: 500
        priority:
          type: string
          description: low, medium or high
          enum:
            - low
            - medium
            - high
          x-apidog-enum:
            - value: low
              name: ''
              description: ''
            - value: medium
              name: ''
              description: ''
            - value: high
              name: ''
              description: ''
        status:
          type: string
          description: todo, in_progress or done
          enum:
            - todo
            - in_progress
            - done
          x-apidog-enum:
            - value: todo
              name: ''
              description: ''
            - value: in_progress
              name: ''
              description: ''
            - value: done
              name: ''
              description: ''
        creatorId:
          type: string
          description: same as user id
        dueDate:
          type: string
          description: yyyy-mm-dd
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          examples:
            - '2025-12-25'
          format: date
      x-apidog-orders:
        - title
        - description
        - priority
        - status
        - creatorId
        - dueDate
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
  securitySchemes: {}
