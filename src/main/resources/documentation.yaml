openapi: "3.0.3"
info:
  title: "Task manager API"
  description: "The tech task manager"
  version: "1.0.0"
servers:
  - url: "https://commtasks.raphdf201.net"
paths:
  /tasks:
    get:
      description: "Creates a new customer"
      requestBody:
        description: "A JSON object containing customer information"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Customer"
      responses:
        "201":
          description: "Created"
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Task"
              examples:
                Example#1:
                  value: "Customer stored correctly"
  /customer/{id}:
    get:
      description: "Returns a customer by its ID"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Customer"
components:
  schemas:
    Task:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        firstName:
          type: "string"
        lastName:
          type: "string"
