              x-apidog-orders:
                - 01K9JW9D9KTR79MNFZMBSTP1Z2
              x-apidog-refs:
                01K9JW9D9KTR79MNFZMBSTP1Z2:
                  $ref: '#/components/schemas/ExposedTaskSend'
              x-apidog-ignore-properties:
                - id
                - title
                - description
                - priority
                - status
                - creatorId
                - dueDate
            examples:
              '1':
                value:
                  title: Task name
                  description: task description
                  dueDate: '2025-12-25'
                  status: todo
                  priority: high
                  creatorId: 1
                summary: Example todo-high
              '2':
                value:
                  title: Task name
                  description: task description
                  dueDate: '2025-12-25'
                  status: in_progress
                  priority: medium
                  creatorId: 1
                summary: Example inprogress-medium
              '3':
                value:
                  title: Task name
                  description: task description
                  dueDate: '2025-12-25'
                  status: done
                  priority: low
                  creatorId: 1
                summary: Example 3 done-low
        required: true
      responses:
